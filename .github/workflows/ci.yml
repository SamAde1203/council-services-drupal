name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Coding standards and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Drupal coding standards (phpcs)
        run: vendor/bin/phpcs

      - name: Start PHP web server for functional tests
        working-directory: web
        run: php -S 127.0.0.1:8080 .ht.router.php > /tmp/php-server.log 2>&1 &

      - name: Unit, kernel and functional tests (PHPUnit)
        env:
          SIMPLETEST_DB: sqlite://localhost//tmp/test.sqlite
          SIMPLETEST_BASE_URL: http://127.0.0.1:8080
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp
        run: vendor/bin/phpunit --log-junit /tmp/junit.xml

      - name: Report test failures as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, os
          if not os.path.exists('/tmp/junit.xml'):
              print('::error title=PHPUnit::No JUnit report; PHPUnit did not start. See the step log.')
              raise SystemExit
          for case in ET.parse('/tmp/junit.xml').iter('testcase'):
              for tag in ('failure', 'error', 'warning'):
                  for node in case.findall(tag):
                      text = ((node.get('message') or '') + ' ' + (node.text or '')).strip()
                      text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')[:1500]
                      print(f"::error title={tag}: {case.get('class', '')}::{case.get('name')}: {text}")
          import glob, re, html
          pages = sorted(glob.glob('web/sites/simpletest/browser_output/*.html'), key=os.path.getmtime)
          for page in pages:
              body = open(page, errors='replace').read()
              if 'unexpected error' in body or 'Error' in body:
                  text = html.unescape(re.sub(r'<[^>]+>', ' ', re.sub(r'(?s)<(script|style|head).*?</\1>', '', body)))
                  text = re.sub(r'\s+', ' ', text).strip()[:1800].replace('%', '%25')
                  print(f"::error title=First error page ({os.path.basename(page)})::{text}")
                  break
          if os.path.exists('/tmp/php-server.log'):
              tail = open('/tmp/php-server.log', errors='replace').read()[-1500:].replace('%', '%25').replace('\n', '%0A')
              print(f"::error title=PHP server log tail::{tail}")
          PY

  accessibility:
    name: Accessibility (axe-core, WCAG 2.2 AA)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Install the demo site
        working-directory: web
        env:
          DRUSH: ../vendor/bin/drush
          DB_URL: sqlite://localhost/sites/default/files/.ht.sqlite
        run: bash ../scripts/setup-demo.sh

      - name: Start PHP web server
        working-directory: web
        run: php -S 127.0.0.1:8888 .ht.router.php > /tmp/php-server.log 2>&1 &

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install Playwright and axe-core
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run accessibility checks
        env:
          BASE_URL: http://127.0.0.1:8888
        run: npm run a11y

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: accessibility-screenshots
          path: tests/accessibility/screenshots/
